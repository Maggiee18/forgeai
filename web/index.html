<!doctype html>
<html lang="en">
  <head>
    <script>
      // set the theme before first paint (no flash): saved choice, else the device setting
      try { var t = localStorage.getItem("forgeai-theme"); } catch (e) {}
      document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForgeAI · the agent that builds agents</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
