[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "1.0.0"
description = "The agent that builds agents: brief + documents -> tested agent + honest report"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "wordllama>=0.4", "pypdf>=4.0", "pydantic>=2.5", "pyyaml>=6.0", "requests>=2.31"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
forgeai = "forgeai.cli:main"

[tool.setuptools]
packages = ["forgeai"]
